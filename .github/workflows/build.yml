name: Build

on:
  push:
  workflow_dispatch:

jobs:
  linux-building:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: setup-local-repo
        uses: actions/checkout@v7          

      - name: build
        run:  |
              sudo apt-get update
              sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev wayland-protocols libxkbcommon-dev extra-cmake-modules
              cmake -S . -B build
              cmake --build build

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          path: ./build/out/**/Game
          archive: false

  windows-building:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: setup-local-repo
        uses: actions/checkout@v7

      - name: build
        run:  |
              cmake -S . -B build
              cmake --build build

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          path: ./build/out/**/Game.exe
          archive: false
  
  macos-building:
    name: MacOS
    runs-on: macos-latest
    steps:
      - name: setup-local-repo
        uses: actions/checkout@v7

      - name: build
        run:  |
              cmake -S . -B build
              cmake --build build

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          path: ./build/out/**/Game
          archive: false