name: Build

on:
  push:
  workflow_dispatch:

jobs:
  linux-building:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: setup-local-repo
        uses: actions/checkout@v4          
      
      # - name: install-cmake
      #   run: sudo apt update && sudo apt install cmake -y

      - name: build
        run:  \
              cmake -S . -B build && \
              cmake --build build
        
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-game
          path: ./build/out


  windows-building:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: setup-local-repo
        uses: actions/checkout@v4

      - name: build
        run:  \
              cmake -S . -B build && \
              cmake --build build

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-game
          path: ./build/out
  
  macos-building:
    name: MacOS
    runs-on: macos-latest
    steps:
      - name: setup-local-repo
        uses: actions/checkout@v4

      # - name: install-brew
      #   run:  \
      #         /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" && \
      #         echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.zprofile && \
      #         eval "$(/opt/homebrew/bin/brew shellenv)"

      # - name: install-cmake
      #   run: brew install cmake

      - name: build
        run: \
              cmake -S . -B build && \
              cmake --build build

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-game
          path: ./build/out